<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5 Günlük Kritik Teknik Operasyon Simülasyonu · v3.1</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --ink: #172033;
            --muted: #667085;
            --line: #e4e9f1;
            --navy: #17233d;
            --navy2: #243454;
            --teal: #0f766e;
            --teal2: #14b8a6;
            --amber: #b7791f;
            --red: #b42318;
            --green: #067647;
            --blue: #175cd3;
            --shadow: 0 16px 45px rgba(23, 32, 51, .09);
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--ink)
        }

        button,
        input,
        textarea,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .hidden {
            display: none !important
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            background: rgba(23, 35, 61, .97);
            backdrop-filter: blur(12px);
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08)
        }

        .topbar-inner {
            max-width: 1440px;
            margin: auto;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: space-between
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 260px
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2dd4bf, #0f766e);
            display: grid;
            place-items: center;
            font-weight: 900;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25)
        }

        .brand h1 {
            font-size: 14px;
            margin: 0;
            font-weight: 850;
            letter-spacing: .03em
        }

        .brand p {
            font-size: 11px;
            color: #bfc8da;
            margin: 3px 0 0
        }

        .top-stats {
            display: flex;
            gap: 10px;
            align-items: center
        }

        .stat-pill {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .11);
            padding: 9px 12px;
            border-radius: 12px;
            min-width: 112px
        }

        .stat-pill span {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: #b9c4d8
        }

        .stat-pill strong {
            display: block;
            font-size: 15px;
            margin-top: 2px
        }

        .budget-ok {
            color: #79e6ce
        }

        .budget-low {
            color: #ffd18a
        }

        .budget-bad {
            color: #ff9f9f
        }

        .daybar {
            background: #fff;
            border-bottom: 1px solid var(--line)
        }

        .daybar-inner {
            max-width: 1440px;
            margin: auto;
            padding: 0 22px;
            display: grid;
            grid-template-columns: repeat(5, 1fr)
        }

        .day-tab {
            position: relative;
            padding: 13px 8px 12px;
            text-align: center;
            color: #7a8497;
            font-size: 12px;
            font-weight: 750;
            border-bottom: 3px solid transparent
        }

        .day-tab.active {
            color: var(--navy);
            border-bottom-color: var(--teal2)
        }

        .day-tab.done {
            color: var(--teal)
        }

        .day-tab .dot {
            display: inline-grid;
            place-items: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #eef2f6;
            margin-right: 6px;
            font-size: 10px
        }

        .day-tab.active .dot {
            background: #d9fbf4;
            color: #087b6b
        }

        .main {
            width: 100%;
            max-width: 1440px;
            margin: auto;
            padding: 26px 22px 50px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 310px;
            gap: 24px;
            align-items: start
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow)
        }

        .start-card {
            max-width: 1040px;
            margin: 34px auto;
            padding: 0;
            overflow: hidden
        }

        .start-hero {
            padding: 44px 46px;
            background: linear-gradient(135deg, #17233d 0%, #203459 55%, #0e6763 120%);
            color: white;
            position: relative;
            overflow: hidden
        }

        .start-hero:after {
            content: "";
            position: absolute;
            width: 390px;
            height: 390px;
            border-radius: 50%;
            right: -120px;
            top: -160px;
            background: rgba(45, 212, 191, .12)
        }

        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #8ce9d7;
            background: rgba(13, 148, 136, .13);
            border: 1px solid rgba(94, 234, 212, .2);
            padding: 7px 10px;
            border-radius: 999px
        }

        .start-hero h2 {
            font-size: 36px;
            line-height: 1.08;
            margin: 16px 0 12px;
            max-width: 780px
        }

        .start-hero p {
            font-size: 16px;
            line-height: 1.65;
            color: #d6dfef;
            max-width: 780px;
            margin: 0
        }

        .start-body {
            padding: 30px 40px 38px
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 26px
        }

        .feature {
            border: 1px solid var(--line);
            background: #f9fbfd;
            border-radius: 14px;
            padding: 14px
        }

        .feature strong {
            display: block;
            font-size: 18px;
            color: var(--navy)
        }

        .feature span {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.4
        }

        .info-box {
            background: #f0f7ff;
            border: 1px solid #d6e9ff;
            color: #264767;
            padding: 15px 17px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.55;
            margin: 16px 0 22px
        }

        .name-row {
            display: flex;
            gap: 10px
        }

        .input {
            width: 100%;
            border: 1px solid #cfd7e3;
            background: white;
            padding: 12px 13px;
            border-radius: 11px;
            outline: none
        }

        .input:focus,
        textarea:focus {
            border-color: #6fc8bc;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, .12)
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 12px 17px;
            font-weight: 800;
            transition: .18s ease
        }

        .btn-primary {
            background: var(--navy);
            color: white
        }

        .btn-primary:hover {
            background: #243454;
            transform: translateY(-1px)
        }

        .btn-teal {
            background: var(--teal);
            color: white
        }

        .btn-light {
            background: #eef2f6;
            color: #344054
        }

        .btn-danger {
            background: #fff0ef;
            color: #b42318;
            border: 1px solid #ffd5d2
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none
        }

        .decision-card {
            overflow: hidden
        }

        .decision-head {
            padding: 22px 24px 17px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #fff, #fbfcfe)
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap
        }

        .day-chip,
        .time-chip,
        .cat-chip {
            font-size: 10px;
            font-weight: 850;
            letter-spacing: .08em;
            text-transform: uppercase;
            border-radius: 999px;
            padding: 6px 9px
        }

        .day-chip {
            background: #e8fbf6;
            color: #087b6b
        }

        .time-chip {
            background: #eef2f6;
            color: #475467
        }

        .cat-chip {
            background: #fff7e8;
            color: #8a5b10
        }

        .decision-head h2 {
            font-size: 25px;
            line-height: 1.24;
            margin: 13px 0 0;
            color: #15213a
        }

        .decision-body {
            padding: 23px 24px 28px
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .11em;
            font-weight: 850;
            color: #7b8495;
            margin-bottom: 10px
        }

        .section-label:before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #14b8a6
        }

        .facts {
            display: grid;
            gap: 8px;
            margin-bottom: 22px
        }

        .fact {
            display: flex;
            gap: 10px;
            padding: 10px 12px;
            background: #f8fafc;
            border: 1px solid #edf0f4;
            border-radius: 11px;
            font-size: 13px;
            line-height: 1.5
        }

        .fact i {
            font-style: normal;
            color: #0e9384;
            font-weight: 900
        }

        .branch-note {
            border: 1px solid #f4d7a4;
            background: #fff9ed;
            border-left: 4px solid #d9a441;
            padding: 13px 14px;
            border-radius: 12px;
            margin: 0 0 18px;
            font-size: 12px;
            line-height: 1.55;
            color: #6f4f17
        }

        .branch-note strong {
            display: block;
            color: #805b12;
            margin-bottom: 3px
        }

        .task-box {
            background: #17233d;
            color: #fff;
            padding: 17px 18px;
            border-radius: 14px;
            margin-bottom: 18px
        }

        .task-box small {
            display: block;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: .12em;
            color: #8ce9d7;
            font-weight: 850;
            margin-bottom: 7px
        }

        .task-box p {
            margin: 0;
            font-size: 14px;
            line-height: 1.55;
            font-weight: 650
        }

        .options {
            display: grid;
            gap: 10px
        }

        .option {
            border: 1.5px solid #dfe5ed;
            border-radius: 14px;
            padding: 14px 15px;
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: start;
            background: white;
            transition: .15s
        }

        .option:hover {
            border-color: #8ccfc5;
            background: #fbfffe
        }

        .option.selected {
            border-color: #0f8f7f;
            background: #f1fbf8;
            box-shadow: 0 0 0 3px rgba(15, 143, 127, .07)
        }

        .opt-letter {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: #eef2f6;
            display: grid;
            place-items: center;
            font-weight: 900;
            color: #475467
        }

        .option.selected .opt-letter {
            background: #0f766e;
            color: white
        }

        .opt-text {
            font-size: 13px;
            line-height: 1.55;
            font-weight: 650;
            color: #344054
        }

        .opt-cost {
            font-size: 10px;
            font-weight: 850;
            white-space: nowrap;
            color: #8b5b16;
            background: #fff5dd;
            border: 1px solid #fae8bb;
            padding: 5px 7px;
            border-radius: 8px
        }

        .opt-cost.zero {
            color: #667085;
            background: #f4f6f8;
            border-color: #e8ebef
        }

        .rationale {
            margin-top: 17px
        }

        .rationale textarea,
        .crit-item textarea,
        .priority-instruction {
            width: 100%;
            border: 1px solid #d2d9e3;
            border-radius: 11px;
            padding: 11px 12px;
            min-height: 78px;
            resize: vertical;
            font-size: 13px
        }

        .hint {
            font-size: 11px;
            color: #7a8494;
            line-height: 1.45;
            margin-top: 5px
        }

        .crit-box {
            margin-top: 18px;
            border: 1px solid #cce9e4;
            background: #f6fffd;
            border-radius: 15px;
            padding: 15px
        }

        .crit-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px
        }

        .crit-head strong {
            font-size: 13px;
            color: #116b62
        }

        .crit-head span {
            font-size: 10px;
            background: #dcf8f2;
            color: #0f766e;
            font-weight: 850;
            padding: 5px 8px;
            border-radius: 999px
        }

        .crit-grid {
            display: grid;
            gap: 8px
        }

        .crit-item {
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 8px;
            align-items: start
        }

        .crit-num {
            width: 24px;
            height: 24px;
            border-radius: 7px;
            background: #dff6f1;
            color: #0d796d;
            font-weight: 900;
            font-size: 11px;
            display: grid;
            place-items: center;
            margin-top: 5px
        }

        .crit-item textarea {
            min-height: 58px
        }

        .priority-list {
            display: grid;
            gap: 10px
        }

        .priority-card {
            border: 1.5px solid #dfe5ed;
            border-radius: 13px;
            padding: 12px;
            display: grid;
            grid-template-columns: 38px 1fr;
            gap: 10px;
            align-items: start;
            cursor: pointer
        }

        .priority-card.selected {
            border-color: #0f8f7f;
            background: #f1fbf8
        }

        .priority-rank {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: #eef2f6;
            display: grid;
            place-items: center;
            font-weight: 900;
            color: #667085
        }

        .priority-card.selected .priority-rank {
            background: #0f766e;
            color: white
        }

        .priority-card .ptext {
            font-size: 13px;
            line-height: 1.45;
            font-weight: 650
        }

        .priority-card .priority-instruction {
            grid-column: 2;
            min-height: 44px;
            margin-top: 5px
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--line)
        }

        .save-msg {
            font-size: 11px;
            color: #0d7c6d;
            font-weight: 750
        }

        .budget-preview {
            font-size: 11px;
            color: #667085
        }

        .budget-preview.warn {
            color: #a15c00;
            font-weight: 750
        }

        .budget-preview.bad {
            color: #b42318;
            font-weight: 800
        }

        .sidebar {
            display: grid;
            gap: 15px;
            position: sticky;
            top: 126px
        }

        .side-card {
            padding: 17px 17px
        }

        .side-card h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: #788296;
            margin: 0 0 12px
        }

        .budget-big {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -.03em;
            color: #16334d
        }

        .budget-sub {
            font-size: 11px;
            color: #7a8493;
            margin-top: 4px
        }

        .budget-bar {
            height: 8px;
            background: #edf0f4;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 12px
        }

        .budget-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f766e, #23bfae);
            border-radius: 99px;
            transition: .3s
        }

        .mini-list {
            display: grid;
            gap: 8px
        }

        .mini-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 11px;
            padding-bottom: 7px;
            border-bottom: 1px solid #eef1f5
        }

        .mini-row:last-child {
            border-bottom: 0
        }

        .mini-row span {
            color: #717b8d
        }

        .mini-row strong {
            color: #344054;
            text-align: right
        }

        .progress-ring {
            display: grid;
            grid-template-columns: 54px 1fr;
            gap: 12px;
            align-items: center
        }

        .ring {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: conic-gradient(#13a593 var(--p), #e8edf2 0);
            position: relative
        }

        .ring:after {
            content: "";
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: white
        }

        .ring strong {
            z-index: 1;
            font-size: 11px
        }

        .progress-ring b {
            font-size: 13px
        }

        .progress-ring p {
            font-size: 10px;
            color: #7b8495;
            margin: 3px 0 0;
            line-height: 1.4
        }

        .tx-list {
            max-height: 210px;
            overflow: auto;
            display: grid;
            gap: 7px
        }

        .tx {
            font-size: 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 7px;
            padding: 8px;
            background: #f8fafc;
            border-radius: 9px
        }

        .tx .muted {
            color: #7a8494
        }

        .tx .money {
            font-weight: 850
        }

        .tx .fail {
            color: #b42318
        }

        .day-transition {
            max-width: 900px;
            margin: 45px auto;
            padding: 38px
        }

        .day-transition .next-day {
            font-size: 11px;
            letter-spacing: .12em;
            font-weight: 900;
            color: #0f766e;
            text-transform: uppercase
        }

        .day-transition h2 {
            font-size: 34px;
            margin: 9px 0
        }

        .day-transition p {
            color: #667085;
            line-height: 1.6
        }

        .day-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 22px 0
        }

        .summary-tile {
            background: #f8fafc;
            border: 1px solid #e8ecf2;
            border-radius: 13px;
            padding: 14px
        }

        .summary-tile span {
            font-size: 10px;
            color: #7b8495;
            display: block;
            text-transform: uppercase;
            letter-spacing: .06em
        }

        .summary-tile strong {
            font-size: 17px;
            display: block;
            margin-top: 4px
        }

        .topup-alert {
            margin: 15px 0;
            background: #edfdf8;
            border: 1px solid #c4f0e5;
            padding: 13px;
            border-radius: 12px;
            color: #0f685f;
            font-size: 12px;
            line-height: 1.5
        }

        .result-wrap {
            max-width: 1180px;
            margin: 30px auto
        }

        .result-hero {
            padding: 35px;
            background: linear-gradient(135deg, #17233d, #243b66);
            color: white;
            position: relative;
            overflow: hidden
        }

        .result-hero:after {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            right: -90px;
            top: -140px;
            background: rgba(45, 212, 191, .12)
        }

        .result-grid {
            display: grid;
            grid-template-columns: 190px 1fr;
            gap: 28px;
            align-items: center;
            position: relative;
            z-index: 1
        }

        .score-orb {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: conic-gradient(#2dd4bf var(--scorep), rgba(255, 255, 255, .12) 0);
            display: grid;
            place-items: center;
            position: relative
        }

        .score-orb:before {
            content: "";
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #1d2e50
        }

        .score-orb div {
            z-index: 1;
            text-align: center
        }

        .score-orb strong {
            display: block;
            font-size: 46px;
            line-height: 1
        }

        .score-orb span {
            font-size: 12px;
            color: #bfc9dc
        }

        .result-hero .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: #8ce9d7;
            font-weight: 850
        }

        .result-hero h2 {
            font-size: 31px;
            margin: 7px 0 9px
        }

        .result-hero p {
            color: #d7e0ef;
            line-height: 1.55;
            margin: 0
        }

        .outcome-card {
            margin-top: 18px;
            padding: 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .09);
            border: 1px solid rgba(255, 255, 255, .12)
        }

        .outcome-card strong {
            display: block;
            font-size: 18px;
            margin-bottom: 5px
        }

        .outcome-card p {
            font-size: 13px;
            color: #d8e1ef
        }

        .result-body {
            padding: 24px
        }

        .profiles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px
        }

        .profile {
            padding: 13px;
            border: 1px solid #e4e8ef;
            border-radius: 12px
        }

        .profile-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 12px;
            font-weight: 750
        }

        .profile-bar {
            height: 7px;
            background: #edf0f3;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 9px
        }

        function evaluatorHTML(out, hg, hm) { const states = { ...S.flags, ...S.marks }; return `<details class="evaluator"><summary>Değerlendirici Paneli · Katılımcıya göstermeyin</summary><div class="eval-warning">Şıklı kararlarda yazılı gerekçeye göre baz puan ±1 değiştirilebilir. Serbest kritik unsur puanları kavram aileleri üzerinden otomatik eşleştirilir ve manuel düzeltilebilir. HG/HM hücreleri rota enjeksiyonu etkisine göre ±1 ayarlanabilir; 0–2 sınırı korunur.</div><div class="mini-list"><div class="mini-row"><span>Ignition Debt (I)</span><strong>${out.I}</strong></div><div class="mini-row"><span>Fire Barrier Debt (F)</span><strong>${out.F} / 6</strong></div><div class="mini-row"><span>Hasta Güvenliği</span><strong>${hg.score} / 100</strong></div><div class="mini-row"><span>Hasta Deneyimi</span><strong>${hm.score} / 100</strong></div><div class="mini-row"><span>Kaynak statüsü</span><strong>${S.marks.SOURCE_RESOLVED ? 'Hafta içinde çözüldü' : S.marks.SOURCE_ISOLATED || S.marks.SOURCE_ISOLATED_FINAL ? 'Kontrollü izole edildi' : 'İşletmede / çözülmemiş'}</strong></div></div><div class="eval-table">${Object.values(S.answers).sort((a, b) => a.id - b.id).map(a => `<div class="eval-row"><b>K${String(a.id).padStart(2, '0')}</b><div>${esc(a.rationale || a.title)}${a.id === 1 ? `<br><span>Erteleme: ${esc(a.deferredWork || '—')} · ${esc(a.returnTime || '—')} · ${esc(a.escalationThreshold || 'eşik yok')}</span>` : ''}${a.funded === false ? '<br><span style="color:#b42318">Bütçe nedeniyle uygulanamadı.</span>' : ''}</div><div>Baz ${a.baseScore}/4</div><select onchange="setAdj(${a.id},this.value)"><option value="-1" ${S.evaluatorAdj[a.id] == -1 ? 'selected' : ''}>-1</option><option value="0" ${!S.evaluatorAdj[a.id] ? 'selected' : ''}>±0</option><option value="1" ${S.evaluatorAdj[a.id] == 1 ? 'selected' : ''}>+1</option></select></div>${a.critical ? `<div class="eval-row"><b>Serbest</b><div>K${String(a.id).padStart(2, '0')} kavram ailesi puanı<br><span>Otomatik eşleşme: ${esc(criticalMatches(a.id, a.critical).map(x => x.label).join(' · ') || 'eşleşme yok')}</span></div><div>${a.critScore}/5</div><input type="number" min="0" max="5" value="${criticalScore(a.id)}" onchange="setCrit(${a.id},this.value)"></div>` : ''}${IMPACT_MATRIX[a.id] ? impactEvalRows(a.id) : ''}`).join('')}</div><div class="section-label" style="margin-top:16px">Gizli durum değişkenleri</div><div class="state-grid">${Object.entries(states).map(([k, v]) => `<div class="state-item">${esc(k)}<b>${String(v)}</b></div>`).join('')}</div></details>` }
        function impactEvalRows(id) { const hg = impactValue(id, 'HG'), hm = impactValue(id, 'HM'); return `<div class="eval-row impact-eval"><b>HG/HM</b><div>K${String(id).padStart(2, '0')} çapraz hasta etkisi${routeImpactAdj(id, 'HG') || routeImpactAdj(id, 'HM') ? '<br><span>Rota enjeksiyonu otomatik düzeltmesi uygulanmıştır.</span>' : ''}</div><div>HG ${hg ?? '–'} · HM ${hm ?? '–'}</div><div class="impact-controls">${hg !== null ? `<select onchange="setImpactAdj(${id},'HG',this.value)"><option value="-1" ${S.hgAdj[id] == -1 ? 'selected' : ''}>HG -1</option><option value="0" ${!S.hgAdj[id] ? 'selected' : ''}>HG ±0</option><option value="1" ${S.hgAdj[id] == 1 ? 'selected' : ''}>HG +1</option></select>` : ''}${hm !== null ? `<select onchange="setImpactAdj(${id},'HM',this.value)"><option value="-1" ${S.hmAdj[id] == -1 ? 'selected' : ''}>HM -1</option><option value="0" ${!S.hmAdj[id] ? 'selected' : ''}>HM ±0</option><option value="1" ${S.hmAdj[id] == 1 ? 'selected' : ''}>HM +1</option></select>` : ''}</div></div>`; }
        function setAdj(id, v) { S.evaluatorAdj[id] = +v; save(); renderResult(); }

        function confirmRestart() { modal('Yeni simülasyon başlatılsın mı?', 'Mevcut kararlar silinecek ve 500.000 TL başlangıç fonuyla yeni hafta açılacaktır.', () => reset()); }

        // Helper to fix Firebase stripping empty objects
        function hydrateState(st) {
            if (!st) return freshState();
            st.answers = st.answers || {};
            st.transactions = st.transactions || [];
            st.flags = st.flags || freshState().flags;
            st.marks = st.marks || freshState().marks;
            st.evaluatorAdj = st.evaluatorAdj || {};
            st.critOverride = st.critOverride || {};
            st.hgAdj = st.hgAdj || {};
            st.hmAdj = st.hmAdj || {};
            return st;
        }

        // Format duration
        function formatDuration(ms) {
            if (!ms || ms < 0) return "—";
            const totalSec = Math.floor(ms / 1000);
            const min = Math.floor(totalSec / 60);
            const sec = totalSec % 60;
            return min + " dk " + sec + " sn";
        }

        async function loadConfigAndInit() {
            try {
                injectCSS(); // Inject global CSS
                const res = await fetch('config.json');
                APP_CONFIG = await res.json();
                firebase.initializeApp(APP_CONFIG.firebaseConfig);
                db = firebase.database();

                // Resume session logic
                if (sessionUserEmail) {
                    if (APP_CONFIG.admins.includes(sessionUserEmail)) {
                        renderAdminDashboard();
                        return;
                    } else {
                        const x = load(); // load local state
                        if (x) {
                            S = hydrateState(x);
                            render();
                            return;
                        }
                    }
                }

                renderStart(); // Show login instead of auto-starting
            } catch (e) {
                console.error("Yapılandırma yüklenemedi:", e);
                renderStart(); // Fallback
            }
        }

        // Override renderStart to show the login screen (Split Layout)
        renderStart = function () {
            S.started = false;
            S.completed = false;
            document.getElementById('daybar').classList.add('hidden');
            updateTop();

            document.getElementById('screen').innerHTML = `

            <div class="split-container">
                <!-- Sol Taraf: Yeni Kayıt -->

                        <input id="regName" class="input" placeholder="Ad Soyad" />

                </div>
                
                <div class="split-divider"></div>
                
                <!-- Sağ Taraf: Devam Et / Admin -->
                <div class="split-box">
                    <h3>Oturuma Devam Et / Admin</h3>
                    <p style="font-size:12px; color:#667085; margin-bottom:15px;">Kaldığınız yerden devam etmek veya yönetici paneline ulaşmak için e-postanızı girin.</p>
                    <div style="display:flex; flex-direction:column; gap:12px;">
                        <input id="resEmail" class="input" type="email" placeholder="Kayıtlı e-posta adresiniz" />

        window.registerNew = function () {
            if (!db) { document.getElementById('regError').textContent = "Veritabanı bağlantısı yok."; return; }
            let nameFull = document.getElementById('regName').value.trim();
            let parts = nameFull.split(' ');
            let name = parts.length > 1 ? parts.slice(0, -1).join(' ') : nameFull;
            let surname = parts.length > 1 ? parts[parts.length - 1] : '';
            const facility = document.getElementById('regFacility').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();

            if (!nameFull || !facility || !email) {
                document.getElementById('regError').textContent = "Lütfen tüm alanları doldurun."; return;
            }

            document.getElementById('regError').textContent = "Kontrol ediliyor...";
            document.getElementById('resError').textContent = "";

            const rootRef = db.ref(DB_ROOT);
            rootRef.orderByChild("email").equalTo(email).once("value", snapshot => {
                if (snapshot.exists()) {
                    document.getElementById('regError').textContent = "Bu e-posta kayıtlı. Sağ taraftan devam ediniz.";
                } else {
                    const newUserRef = rootRef.push();
                    sessionUserDocId = newUserRef.key;
                    sessionUserEmail = email;

                    localStorage.setItem('sessionUserDocId', sessionUserDocId);
                    localStorage.setItem('sessionUserEmail', sessionUserEmail);

                    S = freshState();
                    S.started = true;
                    S.participant = nameFull;
                    S.facility = facility;
                    S.email = email;
                    S.startTime = Date.now(); // Start time tracker

                    newUserRef.set({
                        name: name,
                        surname: surname,
                        facility: facility,
                        email: email,
                        state: S,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        save(); // local save
                        render();
                    }).catch(err => {
                        document.getElementById('regError').textContent = "Kayıt hatası: " + err.message;
                    });
                }
            }, error => {
                document.getElementById('regError').textContent = "Bağlantı hatası: " + error.message;
            });
        };

        window.resumeExisting = function () {
            if (!db) { document.getElementById('resError').textContent = "Veritabanı bağlantısı yok."; return; }
            const email = document.getElementById('resEmail').value.trim().toLowerCase();

            if (!email) {
                document.getElementById('resError').textContent = "Lütfen e-posta adresinizi girin."; return;
            }

            if (APP_CONFIG && APP_CONFIG.admins && APP_CONFIG.admins.includes(email)) {
                sessionUserEmail = email;
                localStorage.setItem('sessionUserEmail', email);
                renderAdminDashboard();
                return;
            }

            document.getElementById('resError').textContent = "Hesap aranıyor...";
            document.getElementById('regError').textContent = "";

            const rootRef = db.ref(DB_ROOT);
            rootRef.orderByChild("email").equalTo(email).once("value", snapshot => {
                if (snapshot.exists()) {
                    let existingDocId;
                    let existingData;
                    snapshot.forEach(child => {
                        existingDocId = child.key;
                        existingData = child.val();
                    });

                    sessionUserDocId = existingDocId;
                    sessionUserEmail = email;
                    localStorage.setItem('sessionUserDocId', sessionUserDocId);
                    localStorage.setItem('sessionUserEmail', sessionUserEmail);

                    if (existingData.state) {
                        S = hydrateState(existingData.state);
                        save();
                        render();
                    } else {
                        document.getElementById('resError').textContent = "Kayıtlı veriniz eksik veya bozuk.";
                    }
                } else {
                    document.getElementById('resError').textContent = "Bu e-posta adresi ile kayıt bulunamadı.";
                }
            }, error => {
                document.getElementById('resError').textContent = "Bağlantı hatası: " + error.message;
            });
        };

        // Override save to push to Firebase and log endTime
        const originalSave = save;
        save = function () {
            if (S.completed && !S.endTime) {
                S.endTime = Date.now();
            }

            originalSave(); // save locally
            if (db) {
                // If Admin is inspecting, update the inspected user's doc

                <label style="font-size:12px; font-weight:bold; margin-top:5px; color:#b42318;">E-Posta (Giriş Adresi)</label>
                <input id="editEmail" class="input" type="email" value="${esc(S.email || sessionUserEmail || '')}" />
                
                <div id="editError" style="color:#b42318; font-size:12px; font-weight:bold; text-align:center;"></div>
            </div>
            <div class="modal-actions" style="justify-content: flex-end; gap:10px; display:flex;">
                <button class="btn btn-light" onclick="closeModal()">İptal</button>
                <button class="btn btn-primary" onclick="saveProfileEdit()">Güncelle</button>
            </div>
        </div>
    </div>`;
        };

        window.saveProfileEdit = function () {
            const root = document.getElementById('modalRoot');
            const nameFull = document.getElementById('editName').value.trim();
            const facility = document.getElementById('editFacility').value.trim();
            const email = document.getElementById('editEmail').value.trim().toLowerCase();
            const err = document.getElementById('editError');

            if (!nameFull || !facility || !email) {
                err.textContent = "Lütfen tüm alanları doldurun."; return;
            }

            err.textContent = "Güncelleniyor...";

            let parts = nameFull.split(' ');
            let name = parts.length > 1 ? parts.slice(0, -1).join(' ') : nameFull;
            let surname = parts.length > 1 ? parts[parts.length - 1] : '';

            // Check if new email is already taken by someone ELSE
            if (email !== sessionUserEmail) {
                db.ref(DB_ROOT).orderByChild("email").equalTo(email).once("value", snapshot => {
                    if (snapshot.exists()) {
                        err.textContent = "Bu e-posta adresi başka bir hesaba kayıtlı!";
                    } else {
                        updateUserDoc(name, surname, nameFull, facility, email);
                    }
                });
            } else {
                updateUserDoc(name, surname, nameFull, facility, email);
            }
        };

        function updateUserDoc(name, surname, nameFull, facility, email) {
            if (!sessionUserDocId) return;
            db.ref(DB_ROOT + '/' + sessionUserDocId).update({
                name: name,
                surname: surname,
                facility: facility,
                email: email
            }).then(() => {
                sessionUserEmail = email;
                localStorage.setItem('sessionUserEmail', email);
                S.participant = nameFull;
                S.facility = facility;
                S.email = email;
                save(); // push updated S to firebase just in case
                closeModal();
            }).catch(e => {
                document.getElementById('editError').textContent = "Hata: " + e.message;
            });
        }

        // Inject Buttons for Users
        const origUpdateTop = updateTop;
        updateTop = function () {
            origUpdateTop();
            if (S.started && !document.getElementById('userLogoutBtn')) {
                const topInner = document.querySelector('.topbar-inner');
                if (topInner) {
                    let btnContainer = document.querySelector('.topbar-actions');
                    if (!btnContainer) {
                        btnContainer = document.createElement('div');
                        btnContainer.className = 'topbar-actions';
                        btnContainer.style.marginLeft = 'auto';
                        btnContainer.style.display = 'flex';
                        btnContainer.style.alignItems = 'center';
                        topInner.appendChild(btnContainer);
                    }

                    const btnEdit = document.createElement('button');
                    btnEdit.className = 'user-logout-btn';
                    btnEdit.style.marginRight = '10px';
                    btnEdit.innerHTML = 'Profil';
                    btnEdit.onclick = openProfileEdit;
                    btnContainer.appendChild(btnEdit);

                    const btn = document.createElement('button');
                    btn.id = 'userLogoutBtn';
                    btn.className = 'user-logout-btn';
                    btn.innerHTML = 'Çıkış Yap';
                    btn.onclick = function () {
                        localStorage.clear();
                        location.reload();
                    };
                    btnContainer.appendChild(btn);
                }
            }
        };

        window.addEventListener('beforeunload', save);
        loadConfigAndInit();


    </script>
</body>

</html>
