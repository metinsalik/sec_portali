<!doctype html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Yangın Anı Kriz Yönetimi Simülasyonu</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #fff;
            --ink: #182235;
            --muted: #6a7486;
            --line: #e2e8f0;
            --navy: #16223b;
            --navy2: #26395e;
            --teal: #0f766e;
            --cyan: #0ea5a3;
            --amber: #b7791f;
            --red: #b42318;
            --green: #08765f;
            --blue: #175cd3;
            --shadow: 0 18px 50px rgba(22, 34, 59, .09)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--ink)
        }

        button,
        input,
        textarea {
            font: inherit
        }

        .hidden {
            display: none !important
        }

        .top {
            position: sticky;
            top: 0;
            z-index: 30;
            background: rgba(22, 34, 59, .98);
            color: white;
            border-bottom: 1px solid rgba(255, 255, 255, .08);
            box-shadow: 0 4px 18px rgba(0, 0, 0, .09)
        }

        .topin {
            max-width: 1420px;
            margin: auto;
            padding: 13px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px
        }

        .brand {
            display: flex;
            gap: 11px;
            align-items: center
        }

        .mark {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2dd4bf, #0f766e);
            display: grid;
            place-items: center;
            font-weight: 950
        }

        .brand h1 {
            font-size: 14px;
            margin: 0;
            letter-spacing: .035em
        }

        .brand p {
            font-size: 10px;
            margin: 3px 0 0;
            color: #b8c3d5
        }

        .topstats {
            display: flex;
            gap: 8px
        }

        .pill {
            padding: 8px 11px;
            border: 1px solid rgba(255, 255, 255, .11);
            background: rgba(255, 255, 255, .07);
            border-radius: 11px;
            min-width: 105px
        }

        .pill span {
            display: block;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .09em;
            color: #b8c3d5
        }

        .pill b {
            display: block;
            font-size: 14px;
            margin-top: 2px
        }

        .phasebar {
            background: white;
            border-bottom: 1px solid var(--line)
        }

        .phasein {
            max-width: 1420px;
            margin: auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 4fr 1fr
        }

        .phase {
            font-size: 11px;
            font-weight: 850;
            text-align: center;
            color: #8690a0;
            padding: 11px;
            border-bottom: 3px solid transparent
        }

        .phase.active {
            color: var(--navy);
            border-bottom-color: #14b8a6
        }

        .phase.done {
            color: var(--teal)
        }

        .wrap {
            max-width: 1420px;
            margin: auto;
            padding: 24px 20px 48px
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 310px;
            gap: 22px;
            align-items: start
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow)
        }

        .start {
            max-width: 1030px;
            margin: 30px auto;
            overflow: hidden
        }

        .hero {
            background: linear-gradient(135deg, #16223b, #23375e 62%, #0f6b68 120%);
            color: #fff;
            padding: 45px 46px;
            position: relative;
            overflow: hidden
        }

        .hero:after {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(45, 212, 191, .11);
            right: -130px;
            top: -180px
        }

        .kicker {
            display: inline-block;
            font-size: 10px;
            letter-spacing: .12em;
            font-weight: 900;
            text-transform: uppercase;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(45, 212, 191, .12);
            border: 1px solid rgba(94, 234, 212, .2);
            color: #8ce9d7
        }

        .hero h2 {
            font-size: 37px;
            line-height: 1.08;
            margin: 16px 0 12px;
            max-width: 760px
        }

        .hero p {
            font-size: 15px;
            line-height: 1.65;
            color: #d3ddeb;
            max-width: 780px
        }

        .startbody {
            padding: 28px 38px 38px
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px
        }

        .metric {
            background: #f8fafc;
            border: 1px solid #e7ebf1;
            border-radius: 13px;
            padding: 14px
        }

        .metric strong {
            font-size: 19px
        }

        .metric span {
            display: block;
            font-size: 10px;
            color: var(--muted);
            margin-top: 3px
        }

        .introbox {
            margin: 18px 0;
            background: #eff8ff;
            border: 1px solid #d9eaff;
            color: #315270;
            padding: 14px 16px;
            border-radius: 13px;
            font-size: 12px;
            line-height: 1.55
        }

        .btn {
            border: 0;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 850;
            cursor: pointer;
            transition: .15s
        }

        .btn:hover {
            transform: translateY(-1px)
        }

        .btn-primary {
            background: var(--navy);
            color: white
        }

        .btn-teal {
            background: var(--teal);
            color: white
        }

        .btn-light {
            background: #eef2f6;
            color: #344054
        }

        .btn-danger {
            background: #fff1f0;
            color: #b42318;
            border: 1px solid #ffd1cd
        }

        .decision {
            overflow: hidden
        }

        .head {
            padding: 20px 23px 16px;
            background: linear-gradient(180deg, #fff, #fbfcfe);
            border-bottom: 1px solid var(--line)
        }

        .meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .chip {
            font-size: 9px;
            letter-spacing: .09em;
            font-weight: 900;
            text-transform: uppercase;
            padding: 6px 8px;
            border-radius: 999px
        }

        .time {
            background: #eef2f6;
            color: #475467
        }

        .phasechip {
            background: #e8fbf6;
            color: #087b6b
        }

        .postchip {
            background: #fff7e8;
            color: #8a5b10
        }

        .head h2 {
            font-size: 24px;
            margin: 12px 0 0;
            line-height: 1.25
        }

        .body {
            padding: 21px 23px 27px
        }

        .label {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: .11em;
            text-transform: uppercase;
            color: #7a8495;
            margin: 0 0 9px;
            display: flex;
            align-items: center;
            gap: 7px
        }

        .label:before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #14b8a6
        }

        .facts {
            display: grid;
            gap: 7px;
            margin-bottom: 19px
        }

        .fact {
            font-size: 12px;
            line-height: 1.5;
            padding: 9px 11px;
            border: 1px solid #edf0f4;
            background: #f8fafc;
            border-radius: 10px;
            display: flex;
            gap: 9px
        }

        .fact i {
            font-style: normal;
            color: #0d9488;
            font-weight: 950
        }

        .inj {
            margin: 0 0 17px;
            padding: 12px 13px;
            background: #fff8e8;
            border: 1px solid #f2dda9;
            border-left: 4px solid #d6a03e;
            border-radius: 11px;
            color: #73521a;
            font-size: 11px;
            line-height: 1.5
        }

        .inj b {
            display: block;
            margin-bottom: 3px
        }

        .task {
            background: var(--navy);
            color: white;
            border-radius: 13px;
            padding: 15px 17px;
            margin-bottom: 16px
        }

        .task small {
            display: block;
            font-size: 9px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #8ce9d7;
            font-weight: 900;
            margin-bottom: 6px
        }

        .task p {
            margin: 0;
            font-size: 13px;
            font-weight: 650;
            line-height: 1.5
        }

        .opts {
            display: grid;
            gap: 9px
        }

        .option {
            display: grid;
            grid-template-columns: 32px 1fr;
            gap: 11px;
            padding: 13px 14px;
            border: 1.5px solid #dfe5ed;
            border-radius: 13px;
            background: white;
            cursor: pointer;
            transition: .15s
        }

        .option:hover {
            border-color: #8acfc4
        }

        .option.selected {
            border-color: #0f8f7f;
            background: #f0fbf8;
            box-shadow: 0 0 0 3px rgba(15, 143, 127, .06)
        }

        .letter {
            width: 29px;
            height: 29px;
            border-radius: 9px;
            background: #eef2f6;
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 950;
            color: #475467
        }

        .option.selected .letter {
            background: #0f766e;
            color: white
        }

        .otxt {
            font-size: 12px;
            font-weight: 650;
            line-height: 1.5;
            color: #344054
        }

        .reason {
            margin-top: 15px
        }

        .reason textarea,
        .freeitem textarea,
        .k15 textarea {
            width: 100%;
            border: 1px solid #d2d9e3;
            border-radius: 10px;
            padding: 10px 11px;
            min-height: 64px;
            resize: vertical;
            font-size: 12px;
            outline: none
        }

        .reason textarea:focus,
        .freeitem textarea:focus,
        .k15 textarea:focus {
            border-color: #69c6ba;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, .1)
        }

        .hint {
            font-size: 10px;
            color: #7a8494;
            line-height: 1.45;
            margin-top: 5px
        }

        .freebox {
            border: 1px solid #cde9e4;
            background: #f6fffd;
            border-radius: 14px;
            padding: 14px
        }

        .freehead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 9px
        }

        .freehead strong {
            font-size: 12px;
            color: #0f6a60
        }

        .freehead span {
            font-size: 9px;
            font-weight: 900;
            background: #daf7f0;
            color: #0f766e;
            padding: 5px 7px;
            border-radius: 999px
        }

        .freegrid {
            display: grid;
            gap: 7px
        }

        .freeitem {
            display: grid;
            grid-template-columns: 25px 1fr;
            gap: 7px;
            align-items: start
        }

        .freeitem em {
            width: 23px;
            height: 23px;
            border-radius: 7px;
            background: #dff6f1;
            color: #0d796d;
            font-style: normal;
            font-size: 10px;
            font-weight: 950;
            display: grid;
            place-items: center;
            margin-top: 5px
        }

        .freeitem textarea {
            min-height: 52px
        }

        .ranklist {
            display: grid;
            gap: 8px
        }

        .rank {
            border: 1.5px solid #dfe5ed;
            border-radius: 12px;
            padding: 11px 12px;
            display: grid;
            grid-template-columns: 33px 1fr;
            gap: 10px;
            align-items: start;
            cursor: pointer
        }

        .rank.selected {
            border-color: #0f8f7f;
            background: #f0fbf8
        }

        .ranknum {
            width: 29px;
            height: 29px;
            border-radius: 9px;
            background: #eef2f6;
            display: grid;
            place-items: center;
            font-weight: 950;
            color: #667085
        }

        .rank.selected .ranknum {
            background: #0f766e;
            color: #fff
        }

        .ranktext {
            font-size: 12px;
            line-height: 1.45;
            font-weight: 650
        }

        .k15grid {
            display: grid;
            gap: 14px
        }

        .k15sec {
            border: 1px solid #e4e8ee;
            border-radius: 13px;
            padding: 13px
        }

        .k15sec h4 {
            margin: 0 0 7px;
            font-size: 12px
        }

        .k15sec p {
            font-size: 10px;
            color: #7a8494;
            margin: 0 0 8px;
            line-height: 1.45
        }

        .k15 .smallrow {
            display: grid;
            gap: 7px
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding-top: 17px;
            border-top: 1px solid var(--line)
        }

        .err {
            font-size: 10px;
            color: #b42318;
            font-weight: 750
        }

        .side {
            display: grid;
            gap: 14px;
            position: sticky;
            top: 86px
        }

        .sidecard {
            padding: 16px
        }

        .sidecard h3 {
            font-size: 10px;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: #788296;
            margin: 0 0 11px
        }

        .bigtime {
            font-size: 28px;
            font-weight: 950;
            color: #16334d
        }

        .sub {
            font-size: 10px;
            color: #7a8493;
            margin-top: 4px
        }

        .prog {
            height: 8px;
            background: #edf0f4;
            border-radius: 99px;
            overflow: hidden;
            margin-top: 11px
        }

        .prog i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #0f766e, #23bfae)
        }

        .minilist {
            display: grid;
            gap: 8px
        }

        .mini {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 10px;
            padding-bottom: 7px;
            border-bottom: 1px solid #eef1f5
        }

        .mini:last-child {
            border-bottom: 0
        }

        .mini span {
            color: #717b8d
        }

        .mini b {
            text-align: right
        }

        .timeline {
            display: grid;
            gap: 6px;
            max-height: 245px;
            overflow: auto
        }

        .tl {
            display: grid;
            grid-template-columns: 40px 1fr;
            gap: 8px;
            font-size: 9px;
            padding: 7px;
            background: #f8fafc;
            border-radius: 8px
        }

        .tl b {
            font-size: 9px
        }

        .tl span {
            color: #7a8494
        }

        .stage {
            max-width: 950px;
            margin: 38px auto;
            padding: 35px
        }

        .stage .eyebrow {
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-weight: 900;
            color: #0f766e
        }

        .stage h2 {
            font-size: 33px;
            margin: 8px 0
        }

        .stage p {
            color: #667085;
            line-height: 1.6
        }

        .stagegrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 19px 0
        }

        .stile {
            padding: 13px;
            background: #f8fafc;
            border: 1px solid #e7ebf0;
            border-radius: 12px
        }

        .stile span {
            font-size: 9px;
            color: #7a8495;
            text-transform: uppercase
        }

        .stile b {
            display: block;
            font-size: 16px;
            margin-top: 4px
        }

        .result {
            max-width: 1180px;
            margin: 28px auto;
            overflow: hidden
        }

        .reshero {
            padding: 34px;
            background: linear-gradient(135deg, #16223b, #273e69);
            color: white
        }

        .resgrid {
            display: grid;
            grid-template-columns: 170px 1fr;
            gap: 26px;
            align-items: center
        }

        .orb {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: conic-gradient(#2dd4bf var(--p), rgba(255, 255, 255, .12) 0);
            position: relative
        }

        .orb:before {
            content: "";
            position: absolute;
            width: 132px;
            height: 132px;
            border-radius: 50%;
            background: #1c2d4e
        }

        .orb div {
            z-index: 1;
            text-align: center
        }

        .orb strong {
            font-size: 43px;
            display: block;
            line-height: 1
        }

        .orb span {
            font-size: 11px;
            color: #c2cbdb
        }

        .reshero .eyebrow {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: #8ce9d7;
            font-weight: 900
        }

        .reshero h2 {
            font-size: 30px;
            margin: 7px 0 8px
        }

        .reshero p {
            color: #d6dfec;
            margin: 0;
            line-height: 1.55
        }

        .severity {
            margin-top: 14px;
            padding: 15px;
            background: rgba(255, 255, 255, .09);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 13px
        }

        .severity b {
            font-size: 17px
        }

        .severity p {
            font-size: 12px;
            margin-top: 4px
        }

        .resbody {
            padding: 23px
        }

        .scorecards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px
        }

        .scorecard {
            border: 1px solid #e4e8ef;
            border-radius: 12px;
            padding: 13px
        }

        .scorecard span {
            font-size: 9px;
            color: #7b8495;
            text-transform: uppercase;
            letter-spacing: .06em
        }

        .scorecard strong {
            font-size: 24px;
            display: block;
            margin-top: 3px
        }

        .profiles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
            margin-top: 13px
        }

        .profile {
            padding: 12px;
            border: 1px solid #e4e8ef;
            border-radius: 11px
        }

        .ptop {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 11px;
            font-weight: 750
        }

        .pbar {
            height: 7px;
            background: #edf0f3;
            border-radius: 99px;
            margin-top: 8px;
            overflow: hidden
        }

        .pbar i {
            display: block;
            height: 100%;
            background: #0f8e7e
        }

        .twocol {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 16px;
            margin-top: 17px
        }

        .history {
            display: grid;
            gap: 6px;
            max-height: 445px;
            overflow: auto
        }

        .hrow {
            display: grid;
            grid-template-columns: 42px 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 8px 9px;
            border: 1px solid #e8ecf2;
            border-radius: 9px;
            font-size: 10px
        }

        .hno {
            width: 36px;
            height: 28px;
            border-radius: 7px;
            background: #eef2f6;
            display: grid;
            place-items: center;
            font-weight: 950
        }

        .hrow b {
            font-size: 10px
        }

        .hrow span {
            color: #6f788a
        }

        .badge {
            font-weight: 950;
            background: #e9faf5;
            color: #0f766e;
            padding: 4px 6px;
            border-radius: 7px
        }

        .note {
            background: #eff8ff;
            border: 1px solid #d7e9ff;
            padding: 13px;
            border-radius: 11px;
            font-size: 11px;
            line-height: 1.5;
            color: #315270
        }

        .blind {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 9px
        }

        .tag {
            font-size: 9px;
            padding: 5px 7px;
            border-radius: 999px;
            background: #fff5f2;
            border: 1px solid #f0d2c8;
            color: #9b3a24
        }

        .tag.good {
            background: #f1fbf8;
            border-color: #c8e8df;
            color: #16715f
        }

        .eval {
            margin-top: 17px;
            border: 1px dashed #c8d1dc;
            border-radius: 13px;
            padding: 14px
        }

        .eval summary {
            cursor: pointer;
            font-size: 11px;
            font-weight: 900
        }

        .evalwarn {
            font-size: 9px;
            line-height: 1.5;
            background: #fff8e7;
            border: 1px solid #f4dfa6;
            color: #755113;
            padding: 9px;
            border-radius: 8px;
            margin: 10px 0
        }

        .states {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px
        }

        .state {
            font-size: 8px;
            background: #f8fafc;
            border-radius: 7px;
            padding: 6px
        }

        .state b {
            display: block;
            font-size: 10px;
            margin-top: 2px
        }

        .evalrows {
            display: grid;
            gap: 5px;
            margin-top: 9px
        }

        .erow {
            display: grid;
            grid-template-columns: 48px 1fr 75px;
            gap: 7px;
            align-items: center;
            font-size: 9px;
            padding: 6px;
            border-bottom: 1px solid #eef1f4
        }

        .erow input {
            width: 70px;
            border: 1px solid #d3dbe5;
            border-radius: 7px;
            padding: 5px
        }

        .resultactions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 17px
        }

        @media(max-width:980px) {
            .layout {
                grid-template-columns: 1fr
            }

            .side {
                position: static;
                grid-template-columns: repeat(2, 1fr)
            }

            .scorecards {

            if (!st) return fresh();
            st.answers = st.answers || {};

            if (!ms || ms < 0) return "—";

            const min = Math.floor(totalSec / 60);
            const sec = totalSec % 60;
            return min + " dk " + sec + " sn";
        }

        function choose(k) { selected = k; document.querySelectorAll('.option').forEach(e => e.classList.toggle('selected', e.dataset.key === k)) }
        function toggleRank(k) { const i = rankOrder.indexOf(k); if (i >= 0) rankOrder.splice(i, 1); else { if (rankOrder.length >= 3) return; rankOrder.push(k) } document.querySelectorAll('.rank').forEach(e => { const p = rankOrder.indexOf(e.dataset.key); e.classList.toggle('selected', p >= 0); e.querySelector('.ranknum').textContent = p >= 0 ? p + 1 : '+' }) }
        function sideUI() { const completed = Object.keys(S.answers).length; const pct = Math.round(completed / 16 * 100); return `<aside class="side"><div class="card sidecard"><h3>Olay Zamanı</h3><div class="bigtime">${d().time}</div><div class="sub">Başlangıç 13:42 · mevcut karar düğümü</div><div class="prog"><i style="width:${pct}%"></i></div></div><div class="card sidecard"><h3>Simülasyon İlerlemesi</h3><div class="minilist"><div class="mini"><span>Karar düğümü</span><b>${d().id === '1B' ? 'K1-B' : 'K' + String(d().id).padStart(2, '0')}</b></div><div class="mini"><span>Aşama</span><b>${S.index >= 12 ? 'Teknik inceleme' : 'Yangın anı'}</b></div><div class="mini"><span>Tamamlanan düğüm</span><b>${completed} / 16</b></div></div></div><div class="card sidecard"><h3>Olay Akışı</h3><div class="timeline">${S.history.length ? S.history.slice(-8).reverse().map(h => `<div class="tl"><b>${h.time}</b><span>${esc(h.title)}</span></div>`).join('') : '<div class="hint">Henüz kayıt yok.</div>'}</div></div></aside>` }
        function fail(m) { const e = document.getElementById('err'); e.textContent = m; setTimeout(() => { if (e) e.textContent = '' }, 2600) }
        function scoreFree(x, vals) { const joined = norm(vals.join(' | ')); let hit = 0, used = []; x.concepts.forEach((fam, idx) => { if (fam.some(k => joined.includes(norm(k)))) { hit++; used.push(idx) } }); return { score: Math.min(10, hit * 2), hits: used } }
        function scoreRank(keys) { const critical = ['B', 'C', 'E']; const c = critical.filter(k => keys.includes(k)).length; const dangerous = keys.filter(k => ['A', 'D', 'F'].includes(k)).length; if (c === 3) return 10; if (c === 2 && dangerous === 0) return 7; if (c === 2) return 6; if (c === 1 && dangerous === 0) return 4; if (c === 1) return 2; return dangerous ? 1 : 2 }
        function scoreK15(a) { let s = 0; const st = norm(a.start); const uncertain = ['muhtemel', 'olasi', 'hipotez', 'dusundur', 'kanitlamaz', 'kesin degil'].some(k => st.includes(norm(k))); const startzone = ['dagitim', 'baglanti', 'terminal', 'ups', 'elektrik odasi', 'pano'].some(k => st.includes(norm(k))); s += uncertain && startzone ? 2 : (uncertain || startzone ? 1 : 0); const alts = a.alts.filter(v => v.trim()).length; s += alts >= 3 ? 2 : alts >= 1 ? 1 : 0; const evjoined = norm(a.evidence.join(' | ')); const ef = [['alarm', 'dedektor', 'zon', 'kronoloji'], ['role', 'kesici', 'enerji', 'ups'], ['termal', 'yanik', 'desen'], ['bakim', 'tork', 'servis'], ['gazli', 'oda butunlugu', 'kapı', 'damper', 'hvac', 'basinclandirma'], ['cctv', 'zaman', 'erisim']]; let eh = ef.filter(f => f.some(k => evjoined.includes(norm(k)))).length; s += eh >= 5 ? 3 : eh >= 3 ? 2 : eh >= 1 ? 1 : 0; const ign = norm(a.ignition), bar = norm(a.barriers); const ignok = ['ark', 'gevsek', 'baglanti', 'asiri isin', 'kablo', 'izolasyon', 'yuk', 'koruma'].some(k => ign.includes(norm(k))); const barok = ['kapi', 'damper', 'hvac', 'basinclandirma', 'gazli', 'oda butunlugu', 'enerji kes', 'alarm', 'tahliye'].some(k => bar.includes(norm(k))); s += (ign && bar && ignok && barok) ? 3 : (ign && bar ? 2 : (ign || bar ? 1 : 0)); return Math.min(10, s) }
        function submit() { const x = d(); let a = { id: x.id, title: x.title, time: x.time, type: x.type, score: 0 }; if (x.type === 'choice') { if (!selected) return fail('Bir yaklaşım seçmelisiniz.'); const o = x.options.find(z => z.key === selected); a.choice = selected; a.score = o.tech; a.hg = o.hg; a.hd = o.hd; a.reason = (document.getElementById('reason')?.value || '').trim(); o.flags.forEach(f => S.flags[f] = true) } else if (x.type === 'free5') { const vals = [1, 2, 3, 4, 5].map(i => document.getElementById('free' + i).value.trim()).filter(Boolean); if (!vals.length) return fail('En az bir teknik unsur yazmalısınız.'); const r = scoreFree(x, vals); a.values = vals; a.score = r.score; a.hits = r.hits; if (x.id === '9' && a.score < 6) S.flags.FIRE_BRIEF_GAP = true } else if (x.type === 'rank3') { if (rankOrder.length !== 3) return fail('Tam olarak üç aksiyon seçip sıralamalısınız.'); a.rank = [...rankOrder]; a.score = scoreRank(rankOrder); if (!rankOrder.includes('B')) S.flags.DOOR_GAP = true; if (!rankOrder.includes('C')) S.flags.DAMPER_GAP = true; if (!rankOrder.includes('E')) S.flags.HVAC_GAP = true; if (rankOrder.includes('D')) S.flags.EVAC_ROUTE_GAP = true; if (rankOrder.includes('F')) S.flags.ELEVATOR_EVAC_RISK = true; if (rankOrder.includes('A')) S.flags.SYSTEM_ASSUMPTION = true } else if (x.type === 'k15') { const start = document.getElementById('k15start').value.trim(), alts = [1, 2, 3].map(i => document.getElementById('k15alt' + i).value.trim()), evidence = [1, 2, 3, 4, 5].map(i => document.getElementById('k15ev' + i).value.trim()), ignition = document.getElementById('k15ign').value.trim(), barriers = document.getElementById('k15bar').value.trim(); if (!start || alts.filter(Boolean).length < 3 || evidence.filter(Boolean).length < 3 || !ignition || !barriers) return fail('Dört başlığı doldurun; en az 3 alternatif hipotez ve en az 3 kanıt ailesi yazın.'); a.start = start; a.alts = alts; a.evidence = evidence; a.ignition = ignition; a.barriers = barriers; a.score = scoreK15(a) } S.answers[x.id] = a; S.history.push({ time: x.time, title: x.title }); save(); advance() }
        function advance() { if (S.index === 12) { S.index++; save(); renderStage(); return } if (S.index >= 15) { S.completed = true; save(); render(); return } S.index++; save(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }) }
        function renderStage() { updateTop(); phase(); document.getElementById('app').innerHTML = `<div class="wrap"><section class="card stage"><div class="eyebrow">Yangın kontrol altında · 14:08</div><h2>Kriz yönetiminden teknik incelemeye geçiş</h2><p>İlk 12 karar tamamlandı. Bundan sonraki üç karar olay sonrası idari soruşturma veya ayrıntılı kök neden raporu değildir. Amaç yalnızca kayıt/delil koruma, yangın senaryosunun sistemsel incelemesi ve doğru teknik inceleme planının kurulmasıdır.</p><div class="stagegrid"><div class="stile"><span>Tamamlanan kriz düğümü</span><b>12 + K1-B</b></div><div class="stile"><span>Kalan teknik inceleme</span><b>3 karar</b></div><div class="stile"><span>İlk teknik inceleme saati</span><b>14:20</b></div></div><button class="btn btn-primary" onclick="continueReview()">Teknik İncelemeye Geç</button></section></div>` }
        function continueReview() { render(); window.scrollTo({ top: 0, behavior: 'smooth' }) }
        function techScore(id) { const a = S.answers[id]; if (!a) return 0; return S.overrides[id] !== undefined ? +S.overrides[id] : a.score }
        function totalTech() { const k1 = (techScore('1') + techScore('1B')) / 2; let total = k1; for (let i = 2; i <= 15; i++)total += techScore(String(i)); return Math.round(total * 10) / 10 }
        function patientIndex(field) { const ids = ['1', '1B', '2', '4', '5', '6', '8', '10', '11', '12']; return ids.reduce((n, id) => n + (S.answers[id]?.[field] || 0), 0) }
        function pct(ids) { const vals = ids.map(id => techScore(id)); const max = ids.reduce((n, id) => n + (id === '1M' ? 10 : 10), 0); return Math.round(vals.reduce((a, b) => a + b, 0) / max * 100) }
        function profiles() { return { 'Alarm ve İlk Müdahale': Math.round((((techScore('1') + techScore('1B')) / 2) + techScore('2') + techScore('3')) / 30 * 100), 'Yangın Senaryosu / Savunma Bariyerleri': Math.round((techScore('4') + techScore('5') + techScore('7') + techScore('11') + techScore('12')) / 50 * 100), 'Tahliye ve Kriz Koordinasyonu': Math.round((techScore('6') + techScore('8') + techScore('9') + techScore('10') + techScore('11') + techScore('12')) / 60 * 100), 'Teknik İnceleme Kalitesi': Math.round((techScore('13') + techScore('14') + techScore('15')) / 30 * 100) } }
        function severity() { const F = S.flags; let debt = 0; if (F.VERIFY_DELAY) debt += 1; if (F.SOURCE_DELAY) debt += 1; if (F.RESOURCE_FRAGMENTATION) debt += 1; if (F.OCCUPANCY_RISK || F.PERSONNEL_EXPOSURE) debt += 1; if (F.SUPPRESSION_FALSE_ASSURANCE) debt += 2; if (F.DOOR_OPEN_EARLY) debt += 1; if (F.SMOKE_SPREAD_RISK) debt += 1; if (F.ENERGY_DELAY) debt += 2; if (F.COMM_GAP || F.COMM_STRAIN) debt += 1; if (F.DOOR_GAP) debt += 1; if (F.DAMPER_GAP) debt += 1; if (F.HVAC_GAP) debt += 1; if (F.EVAC_DELAY || F.EVAC_ROUTE_GAP) debt += 1; if (F.COMMAND_FRAGMENT) debt += 2; else if (F.COMMAND_PARTIAL) debt += 1; if (F.PREMATURE_RESET || F.PREMATURE_REENTRY || F.PREMATURE_REENERGIZE) debt += 1; if (F.FIRE_BRIEF_GAP) debt += 1; if (F.ENERGY_CONTROLLED) debt = Math.max(0, debt - 1); if (F.COMMAND_UNIFIED) debt = Math.max(0, debt - 1); if (F.SOURCE_PRIORITY) debt = Math.max(0, debt - 1); if (F.EVAC_PREPARED) debt = Math.max(0, debt - 1); const critical = (F.ENERGY_DELAY && (F.SUPPRESSION_FALSE_ASSURANCE || F.DOOR_OPEN_EARLY) && (F.COMMAND_FRAGMENT || F.EVAC_DELAY)); let lvl = debt <= 2 ? 1 : debt <= 5 ? 2 : debt <= 8 ? 3 : 4; if (critical) lvl = Math.max(lvl, 3); const map = { 1: ['Lokal olay', 'Yangın teknik oda içinde sınırlı kalır; yatay tahliye hazırlığı yapılır ancak hasta transferi gerekmeyebilir.'], 2: ['Kontrollü yangın ve sınırlı duman yayılımı', 'Bir veya iki savunma bariyeri gecikmiştir; hasta katında koku/duman oluşur ve kısa süreli yatay yer değiştirme gerekebilir.'], 3: ['Gelişmiş yangın / kısmi tahliye', 'Enerji, söndürme etkinliği veya bina/komuta bariyerlerindeki birleşik gecikmeler duman yayılımını artırmış; B Blokta kısmi tahliye ve daha uzun hizmet kesintisi gerekmiştir.'], 4: ['Büyük olay', 'Çoklu kritik zafiyet aynı anda aktif kalmış; aktif elektriksel yangın, dikey duman yayılımı ve yüksek tahliye baskısı geniş müdahale ve klinik operasyon kaybına yol açmıştır.'] }; return { level: lvl, debt, title: map[lvl][0], text: map[lvl][1] } }
        function blindspots() { const F = S.flags, b = []; if (F.SOURCE_ANCHORING) b.push('İlk alarma aşırı bağlanma'); if (F.ALARM_COUNT_BIAS) b.push('Alarm sayısı yanlılığı'); if (F.CLINICAL_ORIGIN_BIAS) b.push('Klinik alanı kaynak sanma'); if (F.SUPPRESSION_FALSE_ASSURANCE) b.push('“Sistem çalıştı = fonksiyon başarılı” varsayımı'); if (F.FALSE_REASSURANCE) b.push('Yanlış güvence'); if (F.COMMAND_FRAGMENT) b.push('Parçalı komuta'); if (F.PREMATURE_RESET || F.PREMATURE_REENTRY) b.push('Erken normalleşme'); if (F.EVIDENCE_LOSS) b.push('Delil/kayıt kaybı'); if (F.ELEVATOR_EVAC_RISK) b.push('Asansör tahliye varsayımı'); return b }
        function renderResult() { document.getElementById('phasebar').classList.add('hidden'); const tech = totalTech(), hg = patientIndex('hg'), hd = patientIndex('hd'); const hmEmoji = hd >= 80 ? '😊' : (hd >= 50 ? '😐' : '😞'); const hgEmoji = hg >= 80 ? '✅' : (hg >= 50 ? '⚠️' : '❌'); const sev = severity(), pr = profiles(), bs = blindspots(); document.getElementById('app').innerHTML = `<div class="wrap"><section class="card result"><div class="reshero"><div class="resgrid"><div class="orb" style="--p:${Math.round(tech / 150 * 100)}%"><div><strong>${tech}</strong><span>/ 150</span></div></div><div><div class="eyebrow">Simülasyon tamamlandı · Teknik Hizmetler Müdürü<br><span style="color:#2dd4bf">Katılımcı:</span> ${window.inspectingUser ? esc(window.inspectingUser.adSoyad) : (esc(S.participant) || 'Bilinmiyor')} · <span style="color:#2dd4bf">Tesis:</span> ${window.inspectingUser ? esc(window.inspectingUser.tesisAdi) : 'Bilinmiyor'}</div><h2>Yangın Kriz Yönetimi Sonuç Profili</h2><p>Teknik/yönetsel skor, hasta güvenliği ve hasta deneyimi birbirinden bağımsız gösterilir. Olay şiddeti ise tek bir yanlış karardan değil, kriz boyunca biriken zafiyet kombinasyonundan üretilir.</p><div class="severity"><b>Seviye ${sev.level} · ${esc(sev.title)}</b><p>${esc(sev.text)}</p></div></div></div></div><div class="resbody"><div class="scorecards"><div class="scorecard"><span>Teknik/Yönetsel Yetkinlik</span><strong>${tech} / 150</strong></div><div class="scorecard"><span>Hasta Güvenliği</span><strong>${hg} ${hgEmoji} / 100</strong></div><div class="scorecard"><span>Hasta Deneyimi / İletişim</span><strong>${hd} ${hmEmoji} / 100</strong></div></div><h3 style="font-size:12px;margin:18px 0 10px">Yetkinlik profili</h3><div class="profiles">${Object.entries(pr).map(([n, v]) => `<div class="profile"><div class="ptop"><span>${esc(n)}</span><b>${v}%</b></div><div class="pbar"><i style="width:${v}%"></i></div></div>`).join('')}</div><h3 style="font-size:12px;margin:18px 0 8px">Davranışsal göstergeler</h3><div class="blind">${bs.length ? bs.map(x => `<span class="tag">${esc(x)}</span>`).join('') : '<span class="tag good">Belirgin kritik kör nokta örüntüsü oluşmadı</span>'}</div><div class="twocol"><div><h3 style="font-size:12px;margin:0 0 9px">Karar geçmişi</h3><div class="history">${Object.values(S.answers).map(a => `<div class="hrow"><div class="hno">K${a.id}</div><div><b>${esc(a.title)}</b><br><span>${a.type === 'choice' ? `Seçim ${a.choice}` : a.type === 'rank3' ? `Sıra: ${a.rank.join(' > ')}` : 'Serbest teknik giriş'}</span></div><div class="badge">${techScore(a.id)}/10</div></div>`).join('')}</div></div><div><h3 style="font-size:12px;margin:0 0 9px">Ana değerlendirme ilkesi</h3><div class="note">Güçlü performans; alarmı ciddiye alırken gereksiz tahliye üretmemek, otomatik söndürmeyi gerçek fonksiyonuyla değerlendirmek, enerji izolasyonunu hasta güvenliğiyle birlikte planlamak, cause–effect zincirini saha doğrulamasıyla izlemek, tahliyeyi dinamik rota güvenilirliğine göre yönetmek ve yangın kontrol altına alındıktan sonra delilleri kaybetmeden sistemsel incelemeye geçmektir.</div><div class="note" style="margin-top:10px"><b>Olay şiddeti borcu:</b> ${sev.debt}. Bu sayı eğitim amaçlı simülasyon motorunun iç göstergesidir; tek başına gerçek olay nedenini veya hukuki sorumluluğu ifade etmez.</div></div></div>${evalUI()}<div class="resultactions"><button class="btn btn-primary" onclick="window.print()">Sonucu Yazdır</button><button class="btn btn-light" onclick="restart()">Yeni Simülasyon</button></div></div></section></div>`; updateTop() }
        function evalUI() { const states = Object.keys(S.flags).filter(k => S.flags[k]); return `<details class="eval"><summary>Değerlendirici Paneli · Katılımcıya göstermeyin</summary><div class="evalwarn">Serbest girişlerde otomatik kavram eşleştirmesi yardımcı değerlendirmedir. Teknik eşdeğer ifadeler gerektiğinde aşağıdaki puan alanından manuel düzeltilmelidir. K1 toplam skora K1 ve K1-B aritmetik ortalaması olarak girer; HG/HD ise iki alt düğümü ayrı kullanır.</div><div class="evalrows">${Object.values(S.answers).map(a => `<div class="erow"><b>K${a.id}</b><div>${esc(a.title)}</div><input type="number" min="0" max="10" value="${techScore(a.id)}" onchange="setOverride('${a.id}',this.value)"></div>`).join('')}</div><div class="label" style="margin-top:14px">Aktif gizli durumlar</div><div class="states">${states.length ? states.map(k => `<div class="state">${esc(k)}<b>${esc(FLAG_INFO[k] || 'Aktif')}</b></div>`).join('') : '<div class="state">Gizli durum<b>Aktif kritik bayrak yok</b></div>'}</div></details>` }
        function setOverride(id, v) { S.overrides[id] = Math.max(0, Math.min(10, +v)); save(); renderResult() }
        function restart() { clearSave(); S = fresh(); renderStart() }
        window.addEventListener('beforeunload', save); renderStart();
    </script>
