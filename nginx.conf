events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    client_max_body_size 500M;

    # Docker iç DNS
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost portal.medicalisg.com;

        # =========================================================
        # SSL Kurulumu sonrasi asagidaki HTTP'den HTTPS'e
        # yonlendirme blogunun basindaki # isaretlerini kaldirin
        # =========================================================
        if ($host = mlpcare.medicalisg.com) {
            return 301 https://$host$request_uri;
        }

        location /api/ {
            set $backend_url http://backend:3005;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket.io/ {
            proxy_pass http://backend:3005/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /uploads/ {
            proxy_pass http://backend:3005/uploads/;
        }

        location / {
            set $frontend_url http://frontend:80;
            proxy_pass $frontend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }

    # =========================================================
    # SSL Sertifikasini aldiktan sonra asagidaki HTTPS server
    # blogunun tamamindaki satirlarin basindaki # isaretlerini kaldirin
    # =========================================================
    server {
        listen 443 ssl;
        server_name mlpcare.medicalisg.com;

        ssl_certificate /etc/letsencrypt/live/mlpcare.medicalisg.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mlpcare.medicalisg.com/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /api/ {
            set $backend_url http://backend:3005;
            proxy_pass $backend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /socket.io/ {
            proxy_pass http://backend:3005/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /uploads/ {
            proxy_pass http://backend:3005/uploads/;
        }

        location / {
            set $frontend_url http://frontend:80;
            proxy_pass $frontend_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }
}
